<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#153c6e"/>
      <stop offset="0.55" stop-color="#0c2244"/>
      <stop offset="1" stop-color="#07162c"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.32"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.24" cy="0.18" r="0.85">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- deep blue rounded tile -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#glow)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#edge)" stroke-width="6" opacity="0.55"/>
  <rect x="40" y="40" width="432" height="432" rx="90" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.16"/>

  <!-- circuit traces: a subtle tech accent -->
  <g fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.32">
    <path d="M72 164 H116 V120"/>
    <path d="M440 348 H396 V392"/>
    <path d="M72 348 H116"/>
    <path d="M396 120 H440"/>
  </g>
  <g fill="#7dd3fc" opacity="0.55">
    <circle cx="116" cy="116" r="7"/>
    <circle cx="396" cy="396" r="7"/>
  </g>

  <!-- note sheet with a folded corner -->
  <path d="M168 132 H318 L366 180 V376 Q366 396 346 396 H168 Q148 396 148 376 V152 Q148 132 168 132 Z"
        fill="#0b2b50" stroke="url(#edge)" stroke-width="7" stroke-linejoin="round"/>
  <path d="M318 132 L366 180 H318 Z" fill="#164b7d"/>
  <path d="M318 132 V180 H366" fill="none" stroke="#7dd3fc" stroke-width="6" stroke-linejoin="round" opacity="0.9"/>

  <!-- note text -->
  <g fill="url(#line)">
    <rect x="184" y="218" width="146" height="14" rx="7"/>
    <rect x="184" y="258" width="146" height="14" rx="7" opacity="0.85"/>
    <rect x="184" y="298" width="104" height="14" rx="7" opacity="0.7"/>
  </g>

  <!-- glowing caret: the typewriter / editor cue -->
  <rect x="286" y="284" width="36" height="42" rx="12" fill="#5eead4" opacity="0.35" filter="url(#soft)"/>
  <rect x="296" y="290" width="9" height="30" rx="4" fill="#5eead4"/>
</svg>
